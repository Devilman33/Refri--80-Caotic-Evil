services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-refri}
      POSTGRES_USER: ${POSTGRES_USER:-refri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refri}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-refri} -d ${POSTGRES_DB:-refri}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-refri}:${POSTGRES_PASSWORD:-refri}@db:5432/${POSTGRES_DB:-refri}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

volumes:
  postgres_data:
