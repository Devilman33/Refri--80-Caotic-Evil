services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-refri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refri}
      POSTGRES_DB: ${POSTGRES_DB:-refri}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-refri}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Se compone de las mismas POSTGRES_* que usa el servicio `db`, para que cambiar la
      # contraseña en .env no deje al backend intentando con la vieja. Fijar DATABASE_URL
      # en .env sigue funcionando y tiene precedencia (ver .env.example).
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-refri}:${POSTGRES_PASSWORD:-refri}@db:5432/${POSTGRES_DB:-refri}}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python -m app.seed.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
