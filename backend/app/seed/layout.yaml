# Distribución física del freezer: qué rack va en qué sección y en qué posición
# del estante (centro o derecha), y cuántas subcajas caben en cada uno.
#
# PROVISORIA: se confirmará con los datos actuales del laboratorio (el Excel disponible
# es histórico, ver docs/DATOS.md). No ajustarla a partir del Excel histórico.
#
# Editable a mano sin tocar código. El importador (docs/DATOS.md) reporta en vez de
# crear racks duplicados cuando el Excel trae una sección inconsistente para un rack
# que ya está acá.
#
# `capacity` es la cantidad de subcajas que caben en el rack: 20 = 5 pisos × 4 cajas de
# 2 in, según la tabla de racks del manual serie J del Haier DW-86L388J (el mismo modelo
# que dibuja demo.html). Ajustar si el laboratorio confirma otra capacidad.

racks:
  - letter: A
    section: I
    slot: center
    capacity: 20
  - letter: B
    section: I
    slot: right
    capacity: 20
  - letter: C
    section: II
    slot: center
    capacity: 20
  - letter: D
    section: II
    slot: right
    capacity: 20
  - letter: E
    section: III
    slot: center
    capacity: 20
  - letter: F
    section: III
    slot: right
    capacity: 20
  - letter: G
    section: IV
    slot: center
    capacity: 20
  - letter: H
    section: IV
    slot: right
    capacity: 20
