# Bucle B: Claude implementa -> Copilot revisa -> Claude corrige -> ...
#
# 1. Claude abre un PR desde una rama claude/* (ver claude.yml, se invoca con @claude en un issue).
# 2. Copilot code review revisa el PR automáticamente (ruleset del repo, ver docs/BUCLE.md).
# 3. Cada vez que el PR se abre o recibe un push, `despachar` relanza este workflow con BUCLE_PAT.
#    No se escucha `pull_request_review`: los eventos que genera el bot de Copilot quedan en
#    "action_required" (esperando que alguien pulse *Approve and run*) y el bucle se trababa.
# 4. `corregir` espera a que Copilot publique su review sobre el último commit y decide SIN gastar
#    tokens de Claude:
#    - sin hallazgos High/Critical abiertos  -> espera la CI y mergea;
#    - con hallazgos High y rondas disponibles -> Claude corrige solo eso y hace push con BUCLE_PAT
#      (un push con GITHUB_TOKEN no dispararía ni la CI ni este mismo workflow);
#    - con hallazgos High y sin rondas         -> según AL_LIMITE, mergea con la etiqueta
#      bucle:revisar-despues o se detiene con bucle:requiere-humano.
#    Si Claude revisa los High y concluye que no hay nada que cambiar, también se mergea.
# 5. El CI en rojo nunca se mergea: el PR queda con bucle:requiere-humano y la cadena se detiene.
name: "Bucle B · Claude implementa → Copilot revisa"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número del PR (rama claude/*) cuyas revisiones de Copilot se deben atender"
        required: true
        type: number

env:
  # Rondas de corrección de Claude por PR. Cada ronda consume tokens de la suscripción.
  MAX_ITERACIONES: "3"
  # Qué hacer si tras MAX_ITERACIONES siguen abiertos hallazgos High:
  #   mergear  -> mergea igual (si la CI está en verde) y etiqueta bucle:revisar-despues
  #   detener  -> no mergea y etiqueta bucle:requiere-humano (la cadena se detiene)
  AL_LIMITE: "mergear"
  MARCA: "<!-- bucle-b:correccion-claude"
  # Issue de revisión final: al mergear, los hallazgos que siguen abiertos (Medium/Low que
  # Claude decidió no arreglar, o High si se llegó al límite) se anotan ahí como comentario.
  ISSUE_REVISION_FINAL: "8"
  # Minutos que se espera la review de Copilot antes de pedir ayuda humana.
  ESPERA_REVIEW_MIN: "30"

jobs:
  despachar:
    # Solo PRs de implementación: rama claude/*, del mismo repo y que cierren algún issue.
    # Así un PR de configuración desde una rama claude/* no entra al bucle ni se mergea solo.
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Lanzar corrección de Claude
        env:
          GH_TOKEN: ${{ secrets.BUCLE_PAT }}
          PR: ${{ github.event.pull_request.number }}
          RAMA_BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta el secret BUCLE_PAT (ver docs/BUCLE.md)"
            exit 1
          fi
          issues=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json closingIssuesReferences -q '.closingIssuesReferences | length')
          if [ "$issues" -eq 0 ]; then
            echo "::notice::El PR #$PR no cierra ningún issue (falta 'Closes #N'); no entra al bucle B."
            exit 0
          fi
          gh workflow run bucle-claude-copilot.yml -R "$GITHUB_REPOSITORY" --ref "$RAMA_BASE" -f pr_number="$PR"

  corregir:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: bucle-b-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    # Postgres para que Claude pueda correr los tests del backend igual que la CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: refri
          POSTGRES_PASSWORD: refri
          POSTGRES_DB: refri_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U refri -d refri_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://refri:refri@localhost:5432/refri_test
    steps:
      - name: Contexto e iteraciones
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          read -r estado rama cross sha < <(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json state,headRefName,isCrossRepository,headRefOid -q '.state + " " + .headRefName + " " + (.isCrossRepository | tostring) + " " + .headRefOid')
          echo "rama=$rama" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$estado" != "OPEN" ] || [ "$cross" != "false" ]; then
            echo "El PR #$PR no está abierto o viene de un fork; no se procesa."
            echo "correr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cuerpos=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" | jq -s '[.[][] | .body]')
          iter=$(jq --arg m "$MARCA" '[.[] | select(contains($m))] | length' <<<"$cuerpos")
          ya_atendido=$(jq --arg m "$MARCA sha=$sha" '[.[] | select(contains($m))] | length' <<<"$cuerpos")
          echo "iter=$iter" >> "$GITHUB_OUTPUT"

          if [ "$ya_atendido" -gt 0 ]; then
            echo "La review del commit $sha ya fue atendida; se omite."
            echo "correr=false" >> "$GITHUB_OUTPUT"
          else
            echo "correr=true" >> "$GITHUB_OUTPUT"
          fi

      # El parser de las reviews de Copilot vive en main; se copia fuera del workspace porque
      # el checkout de la rama del PR (más abajo) limpia el directorio de trabajo.
      - uses: actions/checkout@v5
        if: steps.ctx.outputs.correr == 'true'
        with:
          path: _bucle
          sparse-checkout: .github/scripts
      - name: Preparar parser de reviews
        if: steps.ctx.outputs.correr == 'true'
        run: cp _bucle/.github/scripts/hallazgos_copilot.py "$RUNNER_TEMP/hallazgos_copilot.py"

      - name: Esperar la review de Copilot sobre el último commit
        id: espera
        if: steps.ctx.outputs.correr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          SHA: ${{ steps.ctx.outputs.sha }}
        run: |
          set -euo pipefail
          limite=$(( $(date +%s) + ESPERA_REVIEW_MIN * 60 ))
          while :; do
            actual=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
            if [ "$actual" != "$SHA" ]; then
              echo "Llegó un commit nuevo ($actual); lo atiende la siguiente ejecución."
              echo "listo=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            review=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
                       | jq -s --arg s "$SHA" '[.[][] | select((.user.login | test("copilot"; "i")) and .commit_id == $s)] | last // empty')
            if [ -n "$review" ]; then
              echo "Copilot ya revisó $SHA."
              jq -r '.body // ""' <<<"$review" > "$RUNNER_TEMP/review.md"
              echo "review_id=$(jq -r .id <<<"$review")" >> "$GITHUB_OUTPUT"
              echo "listo=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$limite" ]; then
              gh label create "bucle:requiere-humano" -R "$GITHUB_REPOSITORY" --color d73a4a --description "El bucle agente se detuvo" --force
              gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "bucle:requiere-humano"
              gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "Copilot no revisó el commit $SHA en $ESPERA_REVIEW_MIN minutos. Revisa el ruleset (*Automatically request Copilot code review* y *Review new pushes*, ver docs/BUCLE.md) o pide la review a mano y relanza el Bucle B."
              echo "listo=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done

      # Decide sin llamar a Claude. Lee el resumen que Copilot pone en su review
      # ("Open (N)" con la severidad de cada hallazgo abierto) y cuenta los High/Critical.
      - name: Evaluar severidad de la review
        id: eval
        if: steps.espera.outputs.listo == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          REVIEW_ID: ${{ steps.espera.outputs.review_id }}
          ITER: ${{ steps.ctx.outputs.iter }}
        run: |
          set -euo pipefail
          # Cuenta los hallazgos abiertos de la última review ("Open" y "Previously missed").
          read -r high otros < <(python3 "$RUNNER_TEMP/hallazgos_copilot.py" ultima "$RUNNER_TEMP/review.md" \
                                   "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PR" \
                                   "$RUNNER_TEMP/pendientes.md" "$RUNNER_TEMP/abiertos.md")
          if [ "$high" -lt 0 ]; then
            en_linea=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews/$REVIEW_ID/comments" --jq length)
            if [ "$en_linea" -eq 0 ]; then high=0; fi
            echo "Formato de review no reconocido; comentarios en línea: $en_linea"
          fi
          echo "Hallazgos abiertos: $high High/Critical, $otros Medium/Low (ronda $ITER de $MAX_ITERACIONES)"
          echo "high=$high" >> "$GITHUB_OUTPUT"
          echo "otros=$otros" >> "$GITHUB_OUTPUT"

          # Los Medium/Low se triagean una sola vez por PR: en la primera ronda de Claude (que
          # también atiende los High). Lo que quede abierto después se anota en la revisión final.
          if [ "$high" -eq 0 ] && { [ "$otros" -eq 0 ] || [ "$ITER" -gt 0 ]; }; then
            accion=mergear
          elif [ "$ITER" -lt "$MAX_ITERACIONES" ]; then
            accion=corregir
          elif [ "$AL_LIMITE" = "mergear" ]; then
            accion=mergear_con_pendientes
          else
            accion=detener
          fi
          echo "Acción: $accion"
          echo "accion=$accion" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.eval.outputs.accion == 'corregir'
        with:
          ref: ${{ steps.ctx.outputs.rama }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        if: steps.eval.outputs.accion == 'corregir'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        if: steps.eval.outputs.accion == 'corregir'
        with:
          node-version: "22"

      - name: Commit inicial
        if: steps.eval.outputs.accion == 'corregir'
        run: git rev-parse HEAD > "$RUNNER_TEMP/sha_inicial"

      - name: Claude corrige los hallazgos graves
        id: claude
        if: steps.eval.outputs.accion == 'corregir'
        # Si se queda sin turnos, el paso siguiente sube lo que alcanzó a commitear.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Eres el autor del PR #${{ inputs.pr_number }} en ${{ github.repository }} (rama ${{ steps.ctx.outputs.rama }}).
            GitHub Copilot lo revisó: ${{ steps.eval.outputs.high }} hallazgo(s) High/Critical y ${{ steps.eval.outputs.otros }} Medium/Low abiertos.
            Ronda ${{ steps.ctx.outputs.iter }} de un máximo de ${{ env.MAX_ITERACIONES }}. Sé eficiente: cada ronda consume presupuesto.

            1. Lee CLAUDE.md y requirements.md.
            2. Lee la review del commit ${{ steps.ctx.outputs.sha }} y sus comentarios en línea:
               `gh api repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}/reviews/${{ steps.espera.outputs.review_id }}`
               `gh api repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}/comments`
            3. Corrige TODOS los hallazgos High/Critical que sean reales.
            4. De los Medium/Low, corrige los que consideres necesarios: bugs, integridad o pérdida de datos,
               trazabilidad, seguridad, tests faltantes para lógica crítica, o arreglos de pocas líneas.
               NO toques estilo, nombres, refactors grandes ni mejoras opcionales: ponlos en `diferidos`
               con una frase de por qué; se revisarán al final en el issue #${{ env.ISSUE_REVISION_FINAL }}.
            5. Si un hallazgo es un falso positivo o contradice requirements.md, NO lo cambies: explícalo en
               `descartados`. Si no hay nada que cambiar, no hagas commits y el PR se mergeará.
            6. Haz commit (git add + git commit, mensaje en español) apenas termines CADA hallazgo, no todo
               al final: si se acaba el presupuesto de turnos, lo ya commiteado se sube igual.
            7. Corre solo los tests afectados (hay un Postgres listo en DATABASE_URL). NO hagas push.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit,Write,MultiEdit,Bash(mkdir:*),Bash(touch:*),Bash(cp:*),Bash(mv:*),Bash(rm:*),Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(git mv:*),Bash(git restore:*),Bash(git stash:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh api repos/${{ github.repository }}/*),Bash(ls:*),Bash(cd:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(find:*),Bash(grep:*),Bash(rg:*),Bash(sed:*),Bash(awk:*),Bash(sort:*),Bash(uniq:*),Bash(diff:*),Bash(echo:*),Bash(printf:*),Bash(tree:*),Bash(which:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git ls-files:*),Bash(git rev-parse:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(pip3:*),Bash(pytest:*),Bash(alembic:*),Bash(psql:*),Bash(npm:*),Bash(npx:*),Bash(node:*)"
            --json-schema '{"type":"object","properties":{"resumen":{"type":"string"},"descartados":{"type":"array","items":{"type":"string"}},"diferidos":{"type":"array","items":{"type":"string"}}},"required":["resumen","descartados","diferidos"]}'

      - name: Push, merge y resumen
        if: always() && steps.eval.outputs.accion != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUCLE_PAT: ${{ secrets.BUCLE_PAT }}
          ACCION: ${{ steps.eval.outputs.accion }}
          HIGH: ${{ steps.eval.outputs.high }}
          RESULTADO: ${{ steps.claude.outputs.structured_output }}
          RESULTADO_CLAUDE: ${{ steps.claude.outcome }}
          PR: ${{ inputs.pr_number }}
          RAMA: ${{ steps.ctx.outputs.rama }}
          SHA: ${{ steps.ctx.outputs.sha }}
          ITER: ${{ steps.ctx.outputs.iter }}
        run: |
          set -euo pipefail
          n=$((ITER + 1))
          gh label create "bucle:aprobado" -R "$GITHUB_REPOSITORY" --color 2ea44f --description "El bucle terminó sin hallazgos graves" --force
          gh label create "bucle:requiere-humano" -R "$GITHUB_REPOSITORY" --color d73a4a --description "El bucle agente se detuvo" --force
          gh label create "bucle:revisar-despues" -R "$GITHUB_REPOSITORY" --color fbca04 --description "Mergeado con hallazgos High sin resolver" --force
          if [ -z "$RESULTADO" ]; then RESULTADO='{}'; fi
          resumen=""
          pendientes=$(cat "$RUNNER_TEMP/pendientes.md" 2>/dev/null || true)

          # Merge automático con BUCLE_PAT (no GITHUB_TOKEN): cadena.yml escucha el `closed`
          # de este merge y los eventos de GITHUB_TOKEN no disparan workflows.
          # Deja en el issue de revisión final lo que sigue abierto en la última review de Copilot
          # y lo que Claude difirió en esta ronda. Se publica con GITHUB_TOKEN (no dispara
          # workflows) y se neutraliza cualquier "@claude" para que no lance nada.
          anotar_revision_final() {
            local abiertos diferidos cierra
            # Todo lo que Copilot reportó en cualquier review del PR y nunca marcó como resuelto.
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
              | jq -s '[.[][] | select(.user.login | test("copilot"; "i"))]' > "$RUNNER_TEMP/reviews.json"
            python3 "$RUNNER_TEMP/hallazgos_copilot.py" acumulado "$RUNNER_TEMP/reviews.json" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PR" "$RUNNER_TEMP/acumulado.md"
            abiertos=$(cat "$RUNNER_TEMP/acumulado.md")
            diferidos=$(jq -r '.diferidos // [] | .[] | "- \(.)"' <<<"$RESULTADO")
            [ -z "$abiertos$diferidos" ] && return 0
            cierra=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json closingIssuesReferences -q '[.closingIssuesReferences[].number | tostring] | join(" ")')
            if [[ " $cierra " == *" $ISSUE_REVISION_FINAL "* ]]; then return 0; fi
            {
              printf '### Pendientes del PR #%s para la revisión final\n\n' "$PR"
              printf 'Hallazgos de Copilot que quedaron sin arreglar al mergear. Al implementar este issue, revisa cada uno y corrige los que sigan vigentes (algunos pueden haberse arreglado sin que Copilot lo marcara).\n\n'
              if [ -n "$abiertos" ]; then printf '**Reportados por Copilot y no marcados como resueltos:**\n%s\n\n' "$abiertos"; fi
              if [ -n "$diferidos" ]; then printf '**Diferidos por Claude (con su motivo):**\n%s\n' "$diferidos"; fi
            } | sed 's/@claude/Claude/Ig; s/@copilot/Copilot/Ig' > "$RUNNER_TEMP/revision_final.md"
            gh issue comment "$ISSUE_REVISION_FINAL" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/revision_final.md" \
              || echo "::warning::No se pudo comentar en el issue #$ISSUE_REVISION_FINAL"
          }

          mergear() {
            if [ -z "${BUCLE_PAT:-}" ]; then
              echo "::warning::Sin BUCLE_PAT no se puede mergear automáticamente."
              titulo="### ⚠️ $1, pero falta BUCLE_PAT para mergear"
              return
            fi
            if ! GH_TOKEN="$BUCLE_PAT" gh pr checks "$PR" -R "$GITHUB_REPOSITORY" --watch --fail-fast; then
              gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "bucle:requiere-humano"
              titulo="### ⚠️ $1, pero el CI quedó en rojo: no se mergeó"
              return
            fi
            GH_TOKEN="$BUCLE_PAT" gh pr ready "$PR" -R "$GITHUB_REPOSITORY" || true
            if GH_TOKEN="$BUCLE_PAT" gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --squash --delete-branch; then
              titulo="### ✅ $1: mergeado automáticamente"
              anotar_revision_final
            else
              gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "bucle:requiere-humano"
              titulo="### ⚠️ $1, pero GitHub rechazó el merge (¿el ruleset exige aprobaciones?). Revisa el log del run."
            fi
          }

          case "$ACCION" in
            corregir)
              hay_commits=false
              if [ "$(git rev-parse HEAD)" != "$(cat "$RUNNER_TEMP/sha_inicial")" ]; then hay_commits=true; fi
              if [ "$RESULTADO_CLAUDE" != "success" ] && [ "$hay_commits" = false ]; then
                gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "bucle:requiere-humano"
                gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "Claude falló al atender la revisión de Copilot sin dejar commits. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                exit 1
              fi
              if [ "$RESULTADO_CLAUDE" != "success" ]; then
                resumen="Claude se quedó sin turnos en esta ronda; se sube lo que alcanzó a corregir y Copilot vuelve a revisar."
              else
                resumen=$(jq -r '.resumen // "(sin resumen)"' <<<"$RESULTADO")
              fi
              if [ "$hay_commits" = true ]; then
                if [ -z "${BUCLE_PAT:-}" ]; then
                  echo "::error::Falta el secret BUCLE_PAT: sin él el push no dispara la CI ni la siguiente ronda."
                  exit 1
                fi
                # claude-code-action deja `origin` autenticado con GITHUB_TOKEN, y un push con ese
                # token no dispara workflows. Por eso se empuja explícitamente con BUCLE_PAT.
                git push "https://x-access-token:${BUCLE_PAT}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$RAMA"
                titulo="### 🔁 Claude corrigió $HIGH hallazgo(s) High de Copilot (ronda $n/$MAX_ITERACIONES)"
              else
                gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "bucle:aprobado"
                mergear "Claude revisó los hallazgos High y no requieren cambios"
              fi
              ;;
            mergear)
              gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "bucle:aprobado"
              resumen="La review de Copilot no tiene hallazgos High/Critical abiertos. Lo que quede abierto se anota en el issue #$ISSUE_REVISION_FINAL para la revisión final."
              mergear "Sin hallazgos graves"
              ;;
            mergear_con_pendientes)
              gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "bucle:revisar-despues"
              resumen=$(printf 'Se alcanzó el máximo de %s rondas y siguen abiertos estos hallazgos High (revísalos después):\n\n%s' "$MAX_ITERACIONES" "$pendientes")
              mergear "Límite de rondas alcanzado"
              ;;
            detener)
              gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "bucle:requiere-humano"
              resumen=$(printf 'Siguen abiertos estos hallazgos High:\n\n%s' "$pendientes")
              titulo="### 🛑 Bucle detenido: $MAX_ITERACIONES rondas sin resolver los hallazgos High. Requiere revisión humana."
              ;;
          esac

          {
            printf '%s sha=%s ronda=%s -->\n%s\n\n%s\n' "$MARCA" "$SHA" "$n" "$titulo" "$resumen"
            if [ "$(jq '.descartados // [] | length' <<<"$RESULTADO")" -gt 0 ]; then
              printf '\n**Hallazgos descartados por Claude:**\n'
              jq -r '.descartados[] | "- \(.)"' <<<"$RESULTADO"
            fi
            if [ "$(jq '.diferidos // [] | length' <<<"$RESULTADO")" -gt 0 ]; then
              printf '\n**Diferidos a la revisión final (issue #%s):**\n' "$ISSUE_REVISION_FINAL"
              jq -r '.diferidos[] | "- \(.)"' <<<"$RESULTADO"
            fi
          } > "$RUNNER_TEMP/cuerpo.md"
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/cuerpo.md"
