# Bucle B: Claude implementa -> Copilot revisa -> Claude corrige -> ...
#
# 1. Claude abre un PR desde una rama claude/* (ver claude.yml, se invoca con @claude en un issue).
# 2. Copilot code review revisa el PR automáticamente (ruleset del repo, ver docs/BUCLE.md).
# 3. Cuando Copilot envía su review, `despachar` relanza este workflow con BUCLE_PAT.
# 4. Claude atiende los comentarios, hace commit y se hace push con BUCLE_PAT
#    (un push con GITHUB_TOKEN no dispararía la nueva revisión de Copilot).
# 5. Se detiene cuando Claude no necesita cambiar nada o al llegar a MAX_ITERACIONES.
name: "Bucle B · Claude implementa → Copilot revisa"

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número del PR (rama claude/*) cuyas revisiones de Copilot se deben atender"
        required: true
        type: number

env:
  MAX_ITERACIONES: "5"
  MARCA: "<!-- bucle-b:correccion-claude"

jobs:
  despachar:
    if: >-
      github.event_name == 'pull_request_review' &&
      contains(github.event.review.user.login, 'copilot') &&
      startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Lanzar corrección de Claude
        env:
          GH_TOKEN: ${{ secrets.BUCLE_PAT }}
          PR: ${{ github.event.pull_request.number }}
          RAMA_BASE: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta el secret BUCLE_PAT (ver docs/BUCLE.md)"
            exit 1
          fi
          gh workflow run bucle-claude-copilot.yml -R "$GITHUB_REPOSITORY" --ref "$RAMA_BASE" -f pr_number="$PR"

  corregir:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: bucle-b-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Contexto e iteraciones
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          read -r estado rama cross < <(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json state,headRefName,isCrossRepository -q '.state + " " + .headRefName + " " + (.isCrossRepository | tostring)')
          echo "rama=$rama" >> "$GITHUB_OUTPUT"
          if [ "$estado" != "OPEN" ] || [ "$cross" != "false" ]; then
            echo "El PR #$PR no está abierto o viene de un fork; no se procesa."
            echo "correr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          iter=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" | jq -s --arg m "$MARCA" '[.[][] | .body | select(contains($m))] | length')
          echo "iter=$iter" >> "$GITHUB_OUTPUT"

          if [ "$iter" -ge "$MAX_ITERACIONES" ]; then
            gh label create "bucle:requiere-humano" -R "$GITHUB_REPOSITORY" --color d73a4a --description "El bucle agente se detuvo" --force
            gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "bucle:requiere-humano"
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "Bucle detenido: se alcanzó el máximo de $MAX_ITERACIONES rondas de corrección. Requiere revisión humana."
            echo "correr=false" >> "$GITHUB_OUTPUT"
          else
            echo "correr=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.ctx.outputs.correr == 'true'
        with:
          ref: ${{ steps.ctx.outputs.rama }}
          token: ${{ secrets.BUCLE_PAT }}
          fetch-depth: 0

      - name: Identidad de git
        if: steps.ctx.outputs.correr == 'true'
        run: |
          git config user.name "Claude (bucle)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rev-parse HEAD > "$RUNNER_TEMP/sha_inicial"

      - name: Claude atiende la revisión de Copilot
        id: claude
        if: steps.ctx.outputs.correr == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Eres el autor del PR #${{ inputs.pr_number }} en ${{ github.repository }} (rama ${{ steps.ctx.outputs.rama }}).
            GitHub Copilot lo revisó. Esta es la ronda ${{ steps.ctx.outputs.iter }} (máximo ${{ env.MAX_ITERACIONES }}).

            1. Lee CLAUDE.md y requirements.md.
            2. Lee las reviews y los comentarios en línea de Copilot:
               `gh api repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}/reviews`
               `gh api repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}/comments`
               Céntrate en los comentarios de la review más reciente.
            3. Aplica las sugerencias correctas. Descarta las incorrectas o que contradigan
               requirements.md y explica por qué en el resumen.
            4. Ejecuta los tests o el build si existen.
            5. Haz commit de tus cambios con git add + git commit (mensaje en español). NO hagas push:
               el workflow lo hace después.
            Si no hay nada que corregir, no hagas commits.
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api repos/${{ github.repository }}/pulls/*),Bash(git add:*),Bash(git commit:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(ls:*),Bash(npm ci:*),Bash(npm install:*),Bash(npm run:*),Bash(npm test:*),Bash(npx:*),Bash(pip install:*),Bash(python -m pytest:*),Bash(pytest:*)"
            --json-schema '{"type":"object","properties":{"resumen":{"type":"string"},"descartados":{"type":"array","items":{"type":"string"}}},"required":["resumen","descartados"]}'

      - name: Push y resumen
        if: always() && steps.ctx.outputs.correr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO: ${{ steps.claude.outputs.structured_output }}
          RESULTADO_CLAUDE: ${{ steps.claude.outcome }}
          PR: ${{ inputs.pr_number }}
          RAMA: ${{ steps.ctx.outputs.rama }}
          ITER: ${{ steps.ctx.outputs.iter }}
        run: |
          set -euo pipefail
          n=$((ITER + 1))

          if [ "$RESULTADO_CLAUDE" != "success" ]; then
            gh label create "bucle:requiere-humano" -R "$GITHUB_REPOSITORY" --color d73a4a --description "El bucle agente se detuvo" --force
            gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "bucle:requiere-humano"
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "Claude falló al atender la revisión de Copilot. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 1
          fi

          if [ -z "$RESULTADO" ]; then RESULTADO='{}'; fi
          resumen=$(jq -r '.resumen // "(sin resumen)"' <<<"$RESULTADO")

          if [ "$(git rev-parse HEAD)" != "$(cat "$RUNNER_TEMP/sha_inicial")" ]; then
            git push origin "HEAD:$RAMA"
            titulo="### 🔁 Claude atendió la revisión de Copilot (ronda $n/$MAX_ITERACIONES)"
          else
            gh label create "bucle:aprobado" -R "$GITHUB_REPOSITORY" --color 2ea44f --description "Claude aprobó el PR" --force
            gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "bucle:aprobado"
            titulo="### ✅ Sin cambios pendientes tras la revisión de Copilot: bucle terminado"
          fi

          {
            printf '%s ronda=%s -->\n%s\n\n%s\n' "$MARCA" "$n" "$titulo" "$resumen"
            if [ "$(jq '.descartados // [] | length' <<<"$RESULTADO")" -gt 0 ]; then
              printf '\n**Sugerencias descartadas:**\n'
              jq -r '.descartados[] | "- \(.)"' <<<"$RESULTADO"
            fi
          } > cuerpo.md
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file cuerpo.md
