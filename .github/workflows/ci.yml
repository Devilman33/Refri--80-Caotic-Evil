# CI que se adapta a lo que exista: backend Python y/o frontend Node.
# Los pasos se activan solos cuando los agentes crean los archivos del stack.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: refri
          POSTGRES_PASSWORD: refri
          POSTGRES_DB: refri_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U refri -d refri_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://refri:refri@localhost:5432/refri_test
    steps:
      - uses: actions/checkout@v5

      - name: Detectar backend
        id: det
        run: |
          if [ -f backend/pyproject.toml ] || [ -f backend/requirements.txt ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Todavía no hay backend; se omite."
          fi

      - uses: actions/setup-python@v6
        if: steps.det.outputs.existe == 'true'
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        if: steps.det.outputs.existe == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then pip install -r requirements.txt pytest
          else pip install -e ".[dev]"; fi

      - name: Tests
        if: steps.det.outputs.existe == 'true'
        working-directory: backend
        run: python -m pytest -q

      # Un script de restauracion que nunca se ejecuto no es un procedimiento de
      # recuperacion, es un archivo. Este paso lo corre de verdad contra una base scratch:
      # respalda, restaura y comprueba que las tablas llegaron del otro lado.
      #
      # No reusa refri_test: conftest.apply_migrations le borra el schema public entero.
      - name: Instalar cliente de PostgreSQL 16
        if: steps.det.outputs.existe == 'true'
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          pg_dump --version

      - name: Respaldo y restauracion verificados
        if: steps.det.outputs.existe == 'true'
        env:
          PGPASSWORD: refri
          DATABASE_URL: postgresql://refri:refri@localhost:5432/refri_backup_check
        run: |
          createdb -h localhost -U refri refri_backup_check
          ./scripts/verificar-respaldo.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Detectar frontend
        id: det
        run: |
          if [ -f frontend/package.json ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Todavía no hay frontend; se omite."
          fi

      - uses: actions/setup-node@v5
        if: steps.det.outputs.existe == 'true'
        with:
          node-version: "22"

      - name: Instalar, build y tests
        if: steps.det.outputs.existe == 'true'
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          npm test --if-present
