# Invocación manual: menciona @claude en un issue o en la conversación de un PR.
# Si se invoca desde un issue, Claude trabaja en una rama claude/* y abre un PR,
# que entra en el Bucle B (Copilot lo revisa y Claude corrige).
#
# No se escuchan `pull_request_review` ni `pull_request_review_comment`: cada review de
# Copilot generaba ~5 ejecuciones en "action_required" (los eventos del bot de Copilot
# necesitan aprobación manual) que ensuciaban el PR. Para pedirle algo a Claude en un PR,
# escribe @claude en la conversación del PR (issue_comment), no en un comentario en línea.
name: Claude (@claude)

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    # Postgres para que Claude pueda correr los tests del backend igual que la CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: refri
          POSTGRES_PASSWORD: refri
          POSTGRES_DB: refri_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U refri -d refri_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://refri:refri@localhost:5432/refri_test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: anthropics/claude-code-action@v1
        id: claude
        # Si se queda sin turnos, los pasos siguientes rescatan lo avanzado.
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Con BUCLE_PAT no hace falta la Claude GitHub App, y sus push/PR sí disparan
          # la CI y el Bucle B. Si está vacío, se usa la app.
          github_token: ${{ secrets.BUCLE_PAT }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5
            --max-turns 120
            --allowedTools "Read,Glob,Grep,Edit,Write,MultiEdit,Bash(mkdir:*),Bash(touch:*),Bash(cp:*),Bash(mv:*),Bash(rm:*),Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(git mv:*),Bash(git restore:*),Bash(git stash:*),Bash(gh pr create:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh api repos/${{ github.repository }}/*),Bash(jq:*),Bash(cut:*),Bash(tr:*),Bash(xargs:*),Bash(basename:*),Bash(dirname:*),Bash(true:*),Bash(test:*),Bash(timeout:*),Bash(env:*),Bash(ls:*),Bash(cd:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(find:*),Bash(grep:*),Bash(rg:*),Bash(sed:*),Bash(awk:*),Bash(sort:*),Bash(uniq:*),Bash(diff:*),Bash(echo:*),Bash(printf:*),Bash(tree:*),Bash(which:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git ls-files:*),Bash(git rev-parse:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(pip3:*),Bash(pytest:*),Bash(alembic:*),Bash(psql:*),Bash(npm:*),Bash(npx:*),Bash(node:*)"

      - name: Comandos bloqueados por permisos
        if: always()
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$f" ] || exit 0
          jq -r '.[] | select(.type == "result") | .permission_denials // [] | .[]
                 | "::notice title=Permiso denegado::\(.tool_name) \(.tool_input.command // .tool_input.file_path // "" | tostring | .[0:200])"' "$f" || true

      # En este modo Claude sube la rama solo al final: si se queda sin turnos no sube nada y se
      # pierde todo. Se commitea y sube lo avanzado; el PR se marca incompleto y la ronda del
      # Bucle B termina lo que falte.
      - name: Rescatar el avance si Claude se quedó sin turnos
        id: rescate
        if: always() && steps.claude.outcome != 'success' && github.event.issue.pull_request == null && startsWith(steps.claude.outputs.branch_name, 'claude/')
        env:
          BUCLE_PAT: ${{ secrets.BUCLE_PAT }}
          RAMA: ${{ steps.claude.outputs.branch_name }}
          RAMA_BASE: ${{ github.event.repository.default_branch }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          [ -n "$BUCLE_PAT" ] || { echo "::warning::Sin BUCLE_PAT no se puede rescatar."; exit 0; }
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c user.name="claude[bot]" -c user.email="41898282+claude[bot]@users.noreply.github.com" \
              commit -q -m "Avance parcial del issue #$ISSUE (Claude se quedó sin turnos)"
          fi
          git fetch -q origin "$RAMA_BASE"
          if [ "$(git rev-list --count "origin/$RAMA_BASE..HEAD")" -eq 0 ]; then
            echo "No hay avance que rescatar."; exit 0
          fi
          git push "https://x-access-token:${BUCLE_PAT}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$RAMA"
          echo "incompleto=true" >> "$GITHUB_OUTPUT"

      # Claude a veces termina con el enlace "Create PR" sin ejecutar `gh pr create`. Si trabajó
      # sobre un issue y dejó una rama claude/* con commits pero sin PR, lo abre el workflow
      # (con BUCLE_PAT, para que dispare la CI y el Bucle B).
      - name: Abrir el PR si Claude no lo abrió
        if: always() && github.event.issue.pull_request == null && startsWith(steps.claude.outputs.branch_name, 'claude/')
        env:
          GH_TOKEN: ${{ secrets.BUCLE_PAT }}
          RAMA: ${{ steps.claude.outputs.branch_name }}
          ISSUE: ${{ github.event.issue.number }}
          TITULO_ISSUE: ${{ github.event.issue.title }}
          INCOMPLETO: ${{ steps.rescate.outputs.incompleto }}
          RAMA_BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "::warning::Sin BUCLE_PAT no se abre el PR."; exit 0; fi
          if ! git ls-remote --exit-code --heads origin "$RAMA" >/dev/null 2>&1 \
             && [ -z "$(gh api "repos/$GITHUB_REPOSITORY/branches/$RAMA" --jq .name 2>/dev/null || true)" ]; then
            echo "Claude no subió la rama $RAMA; no hay PR que abrir."
            exit 0
          fi
          adelante=$(gh api "repos/$GITHUB_REPOSITORY/compare/$RAMA_BASE...$RAMA" --jq .ahead_by)
          if [ "$adelante" -eq 0 ]; then echo "La rama no tiene commits nuevos."; exit 0; fi
          existente=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$RAMA" --state all --json number --jq '.[0].number // empty')
          if [ -n "$existente" ]; then echo "Ya existe el PR #$existente."; exit 0; fi
          titulo=$(sed -E 's/^\[[0-9]+\/[0-9]+\] *//' <<<"$TITULO_ISSUE")
          {
            printf 'Implementa el issue #%s.\n\nEl detalle de lo implementado está en el comentario de Claude en el issue.\n\n' "$ISSUE"
            if [ "$INCOMPLETO" = true ]; then
              printf '> **IMPLEMENTACIÓN INCOMPLETA:** Claude se quedó sin turnos y este PR tiene solo lo que alcanzó a hacer. La primera ronda del Bucle B debe completar lo que falte del issue.\n\n'
            fi
            printf 'Closes #%s\n' "$ISSUE"
          } > "$RUNNER_TEMP/pr.md"
          gh pr create -R "$GITHUB_REPOSITORY" --base "$RAMA_BASE" --head "$RAMA" \
            --title "$titulo" --body-file "$RUNNER_TEMP/pr.md"

      - name: Guardar el log de Claude
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-log-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 7
