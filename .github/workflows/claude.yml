# Invocación manual: menciona @claude en un issue o en la conversación de un PR.
# Si se invoca desde un issue, Claude trabaja en una rama claude/* y abre un PR,
# que entra en el Bucle B (Copilot lo revisa y Claude corrige).
#
# No se escuchan `pull_request_review` ni `pull_request_review_comment`: cada review de
# Copilot generaba ~5 ejecuciones en "action_required" (los eventos del bot de Copilot
# necesitan aprobación manual) que ensuciaban el PR. Para pedirle algo a Claude en un PR,
# escribe @claude en la conversación del PR (issue_comment), no en un comentario en línea.
name: Claude (@claude)

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    # Postgres para que Claude pueda correr los tests del backend igual que la CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: refri
          POSTGRES_PASSWORD: refri
          POSTGRES_DB: refri_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U refri"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://refri:refri@localhost:5432/refri_test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Con BUCLE_PAT no hace falta la Claude GitHub App, y sus push/PR sí disparan
          # la CI y el Bucle B. Si está vacío, se usa la app.
          github_token: ${{ secrets.BUCLE_PAT }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5
            --max-turns 100
            --allowedTools "Edit,Write,Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(ls:*),Bash(cd:*),Bash(npm ci:*),Bash(npm install:*),Bash(npm run:*),Bash(npm test:*),Bash(npx:*),Bash(pip install:*),Bash(python -m pytest:*),Bash(pytest:*),Bash(python:*),Bash(alembic:*)"
