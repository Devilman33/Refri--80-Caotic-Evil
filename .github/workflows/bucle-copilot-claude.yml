# Bucle A: Copilot implementa -> Claude revisa -> Copilot corrige -> ...
#
# 1. Copilot coding agent abre un PR y, al terminar, pide revisión (review_requested).
# 2. El job `despachar` relanza este workflow como workflow_dispatch usando BUCLE_PAT,
#    así la revisión corre con un actor humano (claude-code-action no acepta bots por defecto).
# 3. Claude revisa el PR contra requirements.md y devuelve un veredicto estructurado.
# 4. Si pide cambios, se comenta "@copilot ..." con BUCLE_PAT (Copilot solo responde a
#    usuarios con acceso de escritura) y Copilot vuelve a trabajar -> vuelve al paso 1.
# 5. Se detiene al aprobar o al llegar a MAX_ITERACIONES (etiqueta bucle:requiere-humano).
name: "Bucle A · Copilot implementa → Claude revisa"

on:
  pull_request:
    types: [review_requested, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número del PR a revisar"
        required: true
        type: number

env:
  # Revisiones de Claude por PR. Cada una consume tokens de la suscripción.
  MAX_ITERACIONES: "3"
  MARCA: "<!-- bucle-a:revision-claude"

jobs:
  despachar:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.user.login == 'Copilot' ||
       github.event.pull_request.user.login == 'copilot-swe-agent[bot]' ||
       contains(github.event.pull_request.labels.*.name, 'bucle'))
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Lanzar revisión de Claude
        env:
          GH_TOKEN: ${{ secrets.BUCLE_PAT }}
          PR: ${{ github.event.pull_request.number }}
          RAMA_BASE: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta el secret BUCLE_PAT (ver docs/BUCLE.md)"
            exit 1
          fi
          gh workflow run bucle-copilot-claude.yml -R "$GITHUB_REPOSITORY" --ref "$RAMA_BASE" -f pr_number="$PR"

  revisar:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: bucle-a-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    # Postgres para que Claude pueda correr los tests del backend igual que la CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: refri
          POSTGRES_PASSWORD: refri
          POSTGRES_DB: refri_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U refri -d refri_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://refri:refri@localhost:5432/refri_test
    steps:
      - name: Contexto e iteraciones
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          read -r estado sha < <(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json state,headRefOid -q '.state + " " + .headRefOid')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$estado" != "OPEN" ]; then
            echo "El PR #$PR está $estado; no se revisa."
            echo "correr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cuerpos=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" | jq -s '[.[][] | .body]')
          iter=$(jq --arg m "$MARCA" '[.[] | select(contains($m))] | length' <<<"$cuerpos")
          ya_revisado=$(jq --arg m "$MARCA sha=$sha" '[.[] | select(contains($m))] | length' <<<"$cuerpos")
          echo "iter=$iter" >> "$GITHUB_OUTPUT"

          if [ "$ya_revisado" -gt 0 ]; then
            echo "El commit $sha ya fue revisado; se omite."
            echo "correr=false" >> "$GITHUB_OUTPUT"
          elif [ "$iter" -ge "$MAX_ITERACIONES" ]; then
            gh label create "bucle:requiere-humano" -R "$GITHUB_REPOSITORY" --color d73a4a --description "El bucle agente se detuvo" --force
            gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "bucle:requiere-humano"
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "Bucle detenido: se alcanzó el máximo de $MAX_ITERACIONES revisiones de Claude. Requiere revisión humana."
            echo "correr=false" >> "$GITHUB_OUTPUT"
          else
            echo "correr=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.ctx.outputs.correr == 'true'
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0

      - uses: actions/setup-python@v6
        if: steps.ctx.outputs.correr == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        if: steps.ctx.outputs.correr == 'true'
        with:
          node-version: "22"

      - name: Revisión de Claude
        id: claude
        if: steps.ctx.outputs.correr == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Eres el revisor del PR #${{ inputs.pr_number }} del repositorio ${{ github.repository }},
            implementado por GitHub Copilot. Esta es la iteración ${{ steps.ctx.outputs.iter }} (máximo ${{ env.MAX_ITERACIONES }}).

            1. Lee CLAUDE.md y requirements.md: son la fuente de verdad del proyecto.
            2. Lee la descripción del PR y el issue vinculado (`gh pr view ${{ inputs.pr_number }}`)
               y el diff (`gh pr diff ${{ inputs.pr_number }}`). El código del PR ya está en el directorio de trabajo.
            3. Si hay tests o build, ejecútalos. Hay un Postgres listo en DATABASE_URL.
            4. Verifica: que cumpla lo que pide el issue, bugs, pérdida de trazabilidad (las muestras
               retiradas NUNCA se borran), seguridad, tests faltantes y coherencia con el stack de CLAUDE.md.

            Veredicto (sé eficiente: cada revisión consume presupuesto):
            - "cambios" SOLO si hay problemas graves: bugs que rompen lo que pide el issue, tests o build
              que fallan, pérdida de trazabilidad, borrado de muestras o fallas de seguridad.
              Cada elemento de cambios_requeridos debe ser una instrucción concreta y accionable para
              Copilot (archivo, problema y cómo arreglarlo). No incluyas mejoras menores.
            - "aprobar" en cualquier otro caso. Estilo, nombres, refactors y mejoras opcionales NO bloquean:
              menciónalos en el resumen como sugerencias.
            - Si es la última iteración y solo quedan detalles menores, aprueba.
            Escribe el resumen y los cambios en español.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh api repos/${{ github.repository }}/*),Bash(jq:*),Bash(cut:*),Bash(tr:*),Bash(xargs:*),Bash(basename:*),Bash(dirname:*),Bash(true:*),Bash(test:*),Bash(timeout:*),Bash(env:*),Bash(ls:*),Bash(cd:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(find:*),Bash(grep:*),Bash(rg:*),Bash(sed:*),Bash(awk:*),Bash(sort:*),Bash(uniq:*),Bash(diff:*),Bash(echo:*),Bash(printf:*),Bash(tree:*),Bash(which:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git ls-files:*),Bash(git rev-parse:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(pip3:*),Bash(pytest:*),Bash(alembic:*),Bash(psql:*),Bash(npm:*),Bash(npx:*),Bash(node:*)"
            --json-schema '{"type":"object","properties":{"veredicto":{"type":"string","enum":["aprobar","cambios"]},"resumen":{"type":"string"},"cambios_requeridos":{"type":"array","items":{"type":"string"}}},"required":["veredicto","resumen","cambios_requeridos"]}'

      - name: Publicar resultado
        if: always() && steps.ctx.outputs.correr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUCLE_PAT: ${{ secrets.BUCLE_PAT }}
          RESULTADO: ${{ steps.claude.outputs.structured_output }}
          PR: ${{ inputs.pr_number }}
          SHA: ${{ steps.ctx.outputs.sha }}
          ITER: ${{ steps.ctx.outputs.iter }}
        run: |
          set -euo pipefail
          gh label create "bucle:aprobado" -R "$GITHUB_REPOSITORY" --color 2ea44f --description "Claude aprobó el PR" --force
          gh label create "bucle:requiere-humano" -R "$GITHUB_REPOSITORY" --color d73a4a --description "El bucle agente se detuvo" --force

          if [ -z "$RESULTADO" ]; then RESULTADO='{}'; fi
          veredicto=$(jq -r '.veredicto // empty' <<<"$RESULTADO")
          resumen=$(jq -r '.resumen // ""' <<<"$RESULTADO")
          marca="$MARCA sha=$SHA -->"
          n=$((ITER + 1))

          case "$veredicto" in
            aprobar)
              printf '%s\n### ✅ Claude aprueba este PR (revisión %s/%s)\n\n%s\n\nListo para revisión humana y merge.\n' \
                "$marca" "$n" "$MAX_ITERACIONES" "$resumen" > cuerpo.md
              gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file cuerpo.md
              gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "bucle:aprobado"
              ;;
            cambios)
              if [ -z "$BUCLE_PAT" ]; then
                echo "::error::Falta el secret BUCLE_PAT: no se puede pedir cambios a Copilot"
                exit 1
              fi
              {
                printf '@copilot Revisión automática de Claude (%s/%s). Corrige lo siguiente en este mismo PR:\n\n' "$n" "$MAX_ITERACIONES"
                jq -r '.cambios_requeridos | to_entries[] | "\(.key + 1). \(.value)"' <<<"$RESULTADO"
                printf '\n**Resumen:** %s\n\n%s\n' "$resumen" "$marca"
              } > cuerpo.md
              # Evita que el comentario (publicado como usuario) dispare también claude.yml
              sed -i 's/@claude/Claude/Ig' cuerpo.md
              GH_TOKEN="$BUCLE_PAT" gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file cuerpo.md
              ;;
            *)
              gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "bucle:requiere-humano"
              gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "La revisión de Claude falló o no entregó un veredicto. Revisa el run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              exit 1
              ;;
          esac

      - name: Guardar el log de Claude
        if: always() && steps.ctx.outputs.correr == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-log-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 7
